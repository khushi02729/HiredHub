# Render blueprint for the API. The frontend is deployed separately on Vercel.
services:
  - type: web
    name: hiredhub-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false            # paste your Atlas connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false            # your Vercel URL, e.g. https://hiredhub.vercel.app
      # To keep uploaded resumes across deploys, attach a Render disk (paid plan),
      # mount it at /var/data and uncomment:
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads
